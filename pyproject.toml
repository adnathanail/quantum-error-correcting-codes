[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qecc"
version = "0.1.0"
description = "Implementing various quantum error-correcting codes in Qiskit, just for fun really"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "fermioniq",
    "qiskit>=2.3.0",
]

[tool.uv.sources]
fermioniq = { path = "/Users/adnathanail/Documents/Fermioniq/Emulator/Client", editable = true }
fermioniq-qc = { path = "/Users/adnathanail/Documents/Fermioniq/Emulator/QCShared", editable = true }

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pylatexenc>=2.10",
    "pytest>=9.0.2",
    "qiskit-aer>=0.17.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 200
extend-exclude = ["qecc/utils/fermioniq_local_backend.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (errors)
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "B9",
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "I",    # isort
    "UP",   # pyupgrade
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "PYI",  # flake8-pyi
    "RUF",  # ruff-specific rules
    "ANN",
    "W",
    "N",
    "ARG",
    "PTH",
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "B011"
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]
